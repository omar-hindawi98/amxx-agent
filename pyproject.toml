[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amxmodx_genai"
version = "1.0.0"
description = "LLM agent bridge for AMXMODX game servers"
requires-python = ">=3.11"
authors = [{ name = "omar-hindawi98" }]
dependencies = [
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "strands-agents[ollama]>=0.1.0",
]


[project.scripts]
genai-sidecar = "amxmodx_genai.server:serve_cli"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "strands-agents[anthropic]>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/amxmodx_genai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
