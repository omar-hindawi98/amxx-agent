name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run pytest tests/unit -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv build

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache AMXMODX compiler
        id: cache-amxmodx
        uses: actions/cache@v4
        with:
          path: /tmp/amxmodx
          key: amxmodx-1.8.2

      - name: Install AMXMODX compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 lib32stdc++6
          if [ "${{ steps.cache-amxmodx.outputs.cache-hit }}" != "true" ]; then
            curl -sL https://www.amxmodx.org/release/amxmodx-1.8.2-base-linux.tar.gz \
              | tar xz -C /tmp/amxmodx
          fi
          echo "/tmp/amxmodx/addons/amxmodx/scripting" >> "$GITHUB_PATH"

      - name: Compile plugins
        run: |
          mkdir -p build
          amxxpc plugins/amxmodx_genai/core.sma \
            -i plugins/amxmodx_genai/include -i plugins/include \
            -o build/core.amxx
          amxxpc tests/plugins/test_json.sma \
            -i plugins/amxmodx_genai/include -i tests/plugins/include \
            -o build/test_json.amxx
          amxxpc tests/plugins/test_e2e.sma \
            -i plugins/amxmodx_genai/include -i plugins/include -i tests/plugins/include \
            -o build/test_e2e.amxx

      - uses: actions/upload-artifact@v4
        with:
          name: amxx-plugins
          path: build/
