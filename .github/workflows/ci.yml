name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run pytest tests/unit -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache AMXMODX compiler
        id: cache-amxmodx
        uses: actions/cache@v6
        with:
          path: /tmp/amxmodx
          key: amxmodx-1.8.2

      - name: Install AMXMODX compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 lib32stdc++6
          if [ "${{ steps.cache-amxmodx.outputs.cache-hit }}" != "true" ]; then
            mkdir -p /tmp/amxmodx
            curl -sL -o /tmp/amxmodx.tar.gz \
              https://www.amxmodx.org/release/amxmodx-1.8.2-base-linux.tar.gz
            tar xzf /tmp/amxmodx.tar.gz -C /tmp/amxmodx
            rm /tmp/amxmodx.tar.gz
          fi
          echo "/tmp/amxmodx/addons/amxmodx/scripting" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/tmp/amxmodx/addons/amxmodx/scripting${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Compile plugins
        run: |
          SCRIPTING=/tmp/amxmodx/addons/amxmodx/scripting
          cp plugins/amxmodx_genai/include/*.inc "$SCRIPTING/include/"
          mkdir -p "$SCRIPTING/include/tools"
          cp plugins/amxmodx_genai/include/tools/*.inc "$SCRIPTING/include/tools/"
          cp plugins/include/*.inc "$SCRIPTING/include/"
          mkdir -p build build/examples

          # Core plugin
          OUT=$(amxxpc plugins/amxmodx_genai/core.sma -i"$SCRIPTING/include" 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q " Error" && { echo "core.sma compilation failed."; exit 1; }
          test -f core.amxx || { echo "core.amxx not produced"; exit 1; }
          mv core.amxx build/core.amxx

          # Example plugins (compile-check only; .amxx output goes to build/examples/)
          FAILED=0
          for SMA in examples/*//*.sma; do
            NAME=$(basename "$SMA" .sma)
            echo "--- Compiling $SMA ---"
            OUT=$(amxxpc "$SMA" -i"$SCRIPTING/include" 2>&1)
            echo "$OUT"
            if echo "$OUT" | grep -q " Error"; then
              echo "FAILED: $SMA"
              FAILED=1
            else
              AMXX="${NAME}.amxx"
              test -f "$AMXX" && mv "$AMXX" "build/examples/$AMXX"
            fi
          done
          test "$FAILED" -eq 0 || { echo "One or more example plugins failed to compile."; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: amxx-plugins
          path: build/
          # build/core.amxx is the release artifact.
          # build/examples/*.amxx are compile-check artifacts only; not released.
