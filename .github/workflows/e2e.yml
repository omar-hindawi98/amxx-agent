name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  GENAI_OLLAMA_MODEL: llama3.2:1b

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: amxmodx-genai-sidecar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services
        run: |
          GENAI_BACKEND=ollama GENAI_OLLAMA_MODEL=${{ env.GENAI_OLLAMA_MODEL }} \
          docker compose up -d ollama sidecar

      - name: Pull Ollama model
        run: |
          docker compose exec ollama ollama pull ${{ env.GENAI_OLLAMA_MODEL }}

      - name: Wait for sidecar
        run: |
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 27016 2>/dev/null && echo "Sidecar ready." && break
            [ "$i" -eq 30 ] && { docker compose logs sidecar; exit 1; }
            sleep 2
          done

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Python live tests
        run: uv run pytest -m live -v
        env:
          GENAI_SIDECAR_HOST: 127.0.0.1
          GENAI_SIDECAR_PORT: 27016

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
