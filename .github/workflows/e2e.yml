name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  AGENT_MODEL_NAME: llama3.2:1b

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Ollama model
        uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ollama-${{ env.AGENT_MODEL_NAME }}

      - uses: docker/setup-buildx-action@v4

      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: amxx-agent-sidecar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services
        run: |
          AGENT_MODEL_BACKEND=ollama AGENT_MODEL_NAME=${{ env.AGENT_MODEL_NAME }} \
          docker compose up -d ollama sidecar

      - name: Pull Ollama model
        run: |
          docker compose exec ollama ollama pull ${{ env.AGENT_MODEL_NAME }}

      - name: Wait for sidecar
        run: |
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 27016 2>/dev/null && echo "Sidecar ready." && break
            [ "$i" -eq 30 ] && { docker compose logs sidecar; exit 1; }
            sleep 2
          done

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v
        env:
          AGENT_SIDECAR_HOST: 127.0.0.1
          AGENT_SIDECAR_PORT: 27016

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
