name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: [ci]
    uses: ./.github/workflows/e2e.yml

  release-please:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.release_created
        with:
          name: amxx-plugins
          path: build/

      - name: Attach core.amxx to release
        if: steps.release.outputs.release_created
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" build/core.amxx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
